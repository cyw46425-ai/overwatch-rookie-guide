name: Bootstrap OW Assistant source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ow-bootstrap
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified release files
        shell: bash
        run: |
          set -euo pipefail
          base="https://overwatch-rookie-guide.cyw46425.chatgpt.site"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "dist/$(dirname "$file")"
            curl --fail --location --retry 4 --retry-delay 2 "$base/$file" --output "dist/$file"
          done <<'OW_FILES'
